{% extends "base.html" %}
{% block title %}Upload Document{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-bold mb-4">Upload Document</h1>
  <form method="post" enctype="multipart/form-data" class="glass p-5 space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="text-sm text-[var(--muted)]">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-red-500 text-xs">{{ field.errors|striptags }}</div>{% endif %}
      </div>
    {% endfor %}
    <p class="text-xs text-[var(--muted)]">Allowed: PDF, images, DOC/DOCX. Max 10MB.</p>
    <button class="btn btn-primary" type="submit">Upload</button>
  </form>
</div>
{% endblock %}
