{% extends "base.html" %}
{% block title %}Website Settings{% endblock %}
{% block content %}
<div class="max-w-xl">
  <h1 class="text-2xl font-bold mb-4">Website Settings</h1>
  <form method="post" enctype="multipart/form-data" class="glass p-5 space-y-4">
    {% csrf_token %}
    <div>
      <label class="text-sm text-[var(--muted)]">Site Name</label>
      <input class="form-input" name="site_name" value="{{ settings_obj.site_name }}">
    </div>
    <div>
      <label class="text-sm text-[var(--muted)]">Tagline</label>
      <input class="form-input" name="tagline" value="{{ settings_obj.tagline }}">
    </div>
    <div>
      <label class="text-sm text-[var(--muted)]">Support Email</label>
      <input class="form-input" type="email" name="support_email" value="{{ settings_obj.support_email }}">
    </div>
    <div>
      <label class="text-sm text-[var(--muted)]">Logo</label>
      {% if settings_obj.logo %}
        <div class="mb-3">
          <img src="{{ settings_obj.logo.url }}" alt="Current logo" class="brand-logo brand-logo--sidebar">
        </div>
      {% endif %}
      <input class="form-input" type="file" name="logo" accept="image/*">
      <p class="text-xs text-[var(--muted)] mt-1">Default brand file: media/logo.jpg</p>
    </div>
    <button class="btn btn-primary" type="submit">Save Settings</button>
  </form>
</div>
{% endblock %}
