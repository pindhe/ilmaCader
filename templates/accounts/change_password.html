{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-bold mb-4">Change Password</h1>
  <form method="post" class="glass p-5 space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="text-sm text-[var(--muted)]">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-red-500 text-xs">{{ field.errors|striptags }}</div>{% endif %}
      </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
